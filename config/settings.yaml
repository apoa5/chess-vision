classifier:
  architecture: mobilenet_v3_small
  input_size: 224
  batch_size: 16
  learning_rate: 0.001
  epochs: 20
  head_epochs: 5
  fine_tune_learning_rate: 0.0001
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0001
  cpu_threads: 4
  seed: 42
  split_fractions: [0.70, 0.15, 0.15]
  split_search_trials: 4000
  imbalance_strategy: sqrt_inverse_frequency_loss
  input_channels: 4
  augmentation:
    brightness: 0.10
    contrast: 0.10
    blur_probability: 0.15
    noise_probability: 0.20
    noise_std: 0.01
  confidence_threshold: 0.70
  dataset_paths:
    train: data/classification/train
    val: data/classification/val
    test: data/classification/test
    metadata: data/classification/crops.json
  checkpoint_path: models/checkpoints/piece_classifier_best.pt
orientation:
  min_similarity: 0.60
  min_matches: 8
  min_score_gap: 0.12
stockfish:
  executable: tools/stockfish/stockfish-linux-x86-64-universal
board:
  normalized_size: 800
  context_margin_squares: 2.0
  crop_padding_squares: 2.0
board_detection:
  max_image_size: 1280
  blur_kernel: 5
  canny_low: 40
  canny_high: 120
  normalize_contrast: false
  min_area_fraction: 0.05
  max_area_fraction: 0.90
  polygon_epsilon: 0.02
  min_checker_correlation: 0.40
  min_checker_contrast: 8.0
  min_score: 0.55
  border_insets: [0.0, 0.04, 0.07, 0.09, 0.11]
  use_wood_color_mask: true
  wood_hue_min: 0
  wood_hue_max: 40
  wood_min_saturation: 60
  use_line_candidates: true
  refine_candidates: 3
data:
  raw: data/raw
  processed: data/processed
  test: data/test
  metadata: data/metadata
outputs:
  board_detection: outputs/board_detection
  rectified_boards: outputs/rectified_boards
  square_crops: outputs/square_crops

learned_markings:
  enabled: true
  min_character_confidence: 0.80
